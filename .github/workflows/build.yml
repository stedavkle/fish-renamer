name: Build Applications

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  # "Run workflow" button: with a version, builds and publishes release v<version>
  # (the tag is created on the built commit); without one, it only builds.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.3.8 (leave empty to only build)'
        required: false
        default: ''

env:
  # Pinned so the same commit always builds the same way. Bump deliberately.
  NUITKA_VERSION: '4.3.1'
  PYTHON_VERSION: '3.12'
  # Empty unless a release was requested via the button. Scripts read it from
  # the environment only, so the typed text is never pasted into a command.
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before building anything if a requested release can't be made
      - name: Check release request
        if: env.RELEASE_VERSION != ''
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases can only be made from main (started from $GITHUB_REF)"; exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.3.8"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" > /dev/null; then
            echo "::error::Tag v$RELEASE_VERSION already exists"; exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The tests only cover the filename parser, which needs no GUI packages
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests

  build-windows:
    needs: test
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
              $version = $ref.Substring($ref.LastIndexOf('v') + 1)
          } elseif ($env:RELEASE_VERSION) {
              $version = $env:RELEASE_VERSION
          } else {
              $version = "0.0.0.0"
          }
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka==${{ env.NUITKA_VERSION }}

      # Compiled C objects (clcache) and Nuitka's downloads (Dependency Walker)
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-${{ hashFiles('**/*.py', 'requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-

      # Standalone folder instead of onefile: onefile unpacks itself to %TEMP% at
      # every start, which Windows Defender flags. The folder runs in place.
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --output-dir=distx64nuitka --output-filename=daves-fish-renamer --windows-icon-from-ico=config/icon.png --include-data-dir="config=config" --enable-plugin=tk-inter --windows-company-name="Dave" --windows-product-name="FishRenamer" --windows-file-version=${{ env.APP_VERSION }} --windows-product-version=${{ env.APP_VERSION }} main.py

      - name: Zip Windows app folder
        run: |
          Rename-Item distx64nuitka/main.dist daves-fish-renamer
          Compress-Archive -Path distx64nuitka/daves-fish-renamer -DestinationPath distx64nuitka/daves-fish-renamer-${{ env.APP_VERSION }}-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: distx64nuitka/daves-fish-renamer-${{ env.APP_VERSION }}-windows.zip
          compression-level: 0

  build-macos:
    needs: test
    runs-on: macos-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@v4

      # 1. Extract the version from the tag
      - name: Get version
        id: get_version
        run: |
          # If triggered by a tag, use the tag name (e.g., v0.3.0 -> 0.3.0)
          # If a release was requested via the button, use its version
          # Otherwise (plain push, PR, build-only run), fallback to a default version
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "$RELEASE_VERSION" ]]; then
            VERSION="$RELEASE_VERSION"
          else
            VERSION="0.0.0-dev"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka==${{ env.NUITKA_VERSION }}

      - name: Install ccache
        run: brew install ccache

      # Compiled C objects (ccache) and Nuitka's downloads
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-${{ hashFiles('**/*.py', 'requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-

      # 2. Use the environment variable in the Nuitka command
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --macos-create-app-bundle --macos-app-icon=config/icon.png --enable-plugin=tk-inter --include-data-dir="config=config" --output-dir=distmipsnuitka --remove-output --macos-app-name=FishRenamer --macos-app-version=${{ env.APP_VERSION }} --macos-signed-app-name=de.dave.FishRenamer --output-filename=daves-fish-renamer ./main.py

      - name: Zip macOS app
        run: |
          cd distmipsnuitka
          mv main.app daves-fish-renamer.app
          tar -czf daves-fish-renamer-${{ env.APP_VERSION }}-macos.app.tar.gz daves-fish-renamer.app
          cd ..

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: distmipsnuitka/daves-fish-renamer-${{ env.APP_VERSION }}-macos.app.tar.gz

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Pushed v* tag, or the button with a version (checked in the test job)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # For the button the tag doesn't exist yet; it is created on the built commit
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
